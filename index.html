<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Shooter</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#juego {
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #25253a 0%, #101018 100%);
}

/* ---------------- MENÚ ---------------- */

#menu,
#pausa {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: rgba(10, 10, 20, 0.94);

    z-index: 100;
}

#menu h1,
#pausa h1 {

    font-size: clamp(45px, 7vw, 90px);

    margin: 0 0 40px;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #4b8cff;

}

button {

    width: min(300px, 80vw);

    padding: 18px;

    margin: 10px;

    border: none;

    border-radius: 12px;

    font-size: 24px;

    font-weight: bold;

    color: white;

    cursor: pointer;

    transition: 0.15s;

}

button:hover {

    transform: scale(1.06);

}

#jugar,
#continuar {

    background: #32d477;

    box-shadow: 0 0 20px rgba(50, 212, 119, 0.4);

}

#salir,
#volver {

    background: #e84747;

}

/* ---------------- INFORMACIÓN ---------------- */

#informacion {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: clamp(15px, 2vw, 24px);

    font-weight: bold;

    color: white;

    z-index: 20;

    pointer-events: none;

}

/* ---------------- JUGADOR ---------------- */

#jugador {

    position: absolute;

    width: 44px;

    height: 44px;

    background: #3c96ff;

    border-radius: 8px;

    box-shadow:

        0 0 10px #3c96ff,

        0 0 25px #3c96ff;

}

/* ---------------- ENEMIGO ---------------- */

.enemigo {

    position: absolute;

    width: 45px;

    height: 45px;

    background: #ff4040;

    border-radius: 50%;

    box-shadow:

        0 0 10px #ff4040,

        0 0 25px #ff4040;

}

/* ---------------- BALAS ---------------- */

.bala {

    position: absolute;

    width: 9px;

    height: 25px;

    background: #ffe033;

    border-radius: 6px;

    box-shadow:

        0 0 8px #ffe033,

        0 0 18px #ffe033;

}

/* ---------------- MENSAJE ---------------- */

#mensaje {

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-size: 50px;

    font-weight: bold;

    pointer-events: none;

    opacity: 0;

    z-index: 50;

}

.oculto {

    display: none !important;

}

</style>
</head>

<body>

<div id="juego">

    <!-- MENÚ PRINCIPAL -->

    <div id="menu">

        <h1>🔫 MINI SHOOTER</h1>

        <button id="jugar">
            ▶ JUGAR
        </button>

        <button id="salir">
            ✖ SALIR
        </button>

    </div>


    <!-- MENÚ PAUSA -->

    <div id="pausa" class="oculto">

        <h1>⏸ PAUSA</h1>

        <button id="continuar">
            ▶ CONTINUAR
        </button>

        <button id="volver">
            🏠 MENÚ PRINCIPAL
        </button>

    </div>


    <!-- INFORMACIÓN -->

    <div id="informacion">

        <span id="puntos">
            🏆 Puntos: 0
        </span>

        <span>
            ⬅️⬆️⬇️➡️ Mover
            &nbsp; | &nbsp;
            ESPACIO 🔫
            &nbsp; | &nbsp;
            ESC ⏸️
        </span>

    </div>


    <!-- JUGADOR -->

    <div id="jugador"></div>


    <!-- MENSAJE -->

    <div id="mensaje"></div>

</div>


<script>

/* ==============================
   ELEMENTOS
============================== */

const juego =
    document.getElementById("juego");

const jugador =
    document.getElementById("jugador");

const menu =
    document.getElementById("menu");

const pausa =
    document.getElementById("pausa");

const puntosTexto =
    document.getElementById("puntos");

const mensaje =
    document.getElementById("mensaje");

const botonJugar =
    document.getElementById("jugar");

const botonSalir =
    document.getElementById("salir");

const botonContinuar =
    document.getElementById("continuar");

const botonVolver =
    document.getElementById("volver");


/* ==============================
   VARIABLES
============================== */

let x = 0;

let y = 0;

let puntos = 0;

let jugando = false;

let pausado = false;

let teclas = {};

let enemigo = null;

let balas = [];


/* ==============================
   SONIDO
============================== */

let audioContext = null;


function iniciarAudio() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    if (audioContext.state === "suspended") {

        audioContext.resume();

    }

}


/* SONIDO DE DISPARO */

function sonidoDisparo() {

    iniciarAudio();

    const oscilador =
        audioContext.createOscillator();

    const ganancia =
        audioContext.createGain();

    oscilador.type = "square";

    oscilador.frequency.setValueAtTime(
        500,
        audioContext.currentTime
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        100,
        audioContext.currentTime + 0.12
    );

    ganancia.gain.setValueAtTime(
        0.15,
        audioContext.currentTime
    );

    ganancia.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.12
    );

    oscilador.connect(ganancia);

    ganancia.connect(audioContext.destination);

    oscilador.start();

    oscilador.stop(
        audioContext.currentTime + 0.12
    );

}


/* SONIDO DE IMPACTO */

function sonidoImpacto() {

    iniciarAudio();

    const oscilador =
        audioContext.createOscillator();

    const ganancia =
        audioContext.createGain();

    oscilador.type = "sawtooth";

    oscilador.frequency.setValueAtTime(
        150,
        audioContext.currentTime
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        50,
        audioContext.currentTime + 0.18
    );

    ganancia.gain.setValueAtTime(
        0.18,
        audioContext.currentTime
    );

    ganancia.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.18
    );

    oscilador.connect(ganancia);

    ganancia.connect(audioContext.destination);

    oscilador.start();

    oscilador.stop(
        audioContext.currentTime + 0.18
    );

}


/* ==============================
   TECLADO
============================== */

document.addEventListener(
    "keydown",
    function(evento) {

        teclas[evento.key] = true;


        /* ESPACIO */

        if (evento.code === "Space") {

            evento.preventDefault();

            if (jugando && !pausado) {

                disparar();

            }

        }


        /* ESC */

        if (evento.key === "Escape") {

            if (!jugando) return;

            pausado = !pausado;

            if (pausado) {

                pausa.classList.remove(
                    "oculto"
                );

            } else {

                pausa.classList.add(
                    "oculto"
                );

            }

        }

    }
);


document.addEventListener(
    "keyup",
    function(evento) {

        teclas[evento.key] = false;

    }
);


/* ==============================
   JUGAR
============================== */

botonJugar.onclick = function() {

    iniciarAudio();

    menu.classList.add("oculto");

    jugador.style.display = "block";

    jugando = true;

    pausado = false;

    puntos = 0;

    balas = [];

    x =
        window.innerWidth / 2 - 22;

    y =
        window.innerHeight - 100;

    puntosTexto.textContent =
        "🏆 Puntos: 0";

    crearEnemigo();

};


/* ==============================
   SALIR
============================== */

botonSalir.onclick = function() {

    alert(
        "¡Gracias por jugar! 🔫"
    );

};


/* ==============================
   CONTINUAR
============================== */

botonContinuar.onclick = function() {

    pausado = false;

    pausa.classList.add(
        "oculto"
    );

};


/* ==============================
   VOLVER AL MENÚ
============================== */

botonVolver.onclick = function() {

    pausado = false;

    jugando = false;

    pausa.classList.add(
        "oculto"
    );

    menu.classList.remove(
        "oculto"
    );

    if (enemigo) {

        enemigo.remove();

        enemigo = null;

    }

    for (const bala of balas) {

        bala.elemento.remove();

    }

    balas = [];

};


/* ==============================
   CREAR ENEMIGO
============================== */

function crearEnemigo() {

    if (enemigo) {

        enemigo.remove();

    }


    enemigo =
        document.createElement("div");

    enemigo.className =
        "enemigo";


    enemigo.style.left =
        Math.random() *
        (window.innerWidth - 50) +
        "px";


    enemigo.style.top =
        80 +
        Math.random() *
        (window.innerHeight - 180) +
        "px";


    juego.appendChild(
        enemigo
    );

}


/* ==============================
   DISPARAR
============================== */

function disparar() {

    sonidoDisparo();


    const bala =
        document.createElement("div");

    bala.className =
        "bala";


    const balaX =
        x + 17;


    const balaY =
        y - 25;


    bala.style.left =
        balaX + "px";


    bala.style.top =
        balaY + "px";


    juego.appendChild(
        bala
    );


    balas.push({

        elemento: bala,

        x: balaX,

        y: balaY

    });

}


/* ==============================
   IMPACTO
============================== */

function mostrarImpacto() {

    mensaje.textContent =
        "💥 ¡IMPACTO!";

    mensaje.style.opacity =
        "1";


    setTimeout(function() {

        mensaje.style.opacity =
            "0";

    }, 200);

}


/* ==============================
   ACTUALIZAR JUEGO
============================== */

function actualizar() {

    if (jugando && !pausado) {


        /* MOVIMIENTO */

        if (teclas["ArrowLeft"]) {

            x -= 7;

        }


        if (teclas["ArrowRight"]) {

            x += 7;

        }


        if (teclas["ArrowUp"]) {

            y -= 7;

        }


        if (teclas["ArrowDown"]) {

            y += 7;

        }


        /* LIMITES */

        x = Math.max(
            0,
            Math.min(
                window.innerWidth - 44,
                x
            )
        );


        y = Math.max(
            60,
            Math.min(
                window.innerHeight - 44,
                y
            )
        );


        jugador.style.left =
            x + "px";


        jugador.style.top =
            y + "px";


        /* BALAS */

        for (
            let i = balas.length - 1;
            i >= 0;
            i--
        ) {

            const bala =
                balas[i];


            bala.y -= 12;


            bala.elemento.style.left =
                bala.x + "px";


            bala.elemento.style.top =
                bala.y + "px";


            /* FUERA DE PANTALLA */

            if (bala.y < 0) {

                bala.elemento.remove();

                balas.splice(i, 1);

                continue;

            }


            /* COLISIÓN */

            if (enemigo) {

                const enemigoX =
                    parseFloat(
                        enemigo.style.left
                    );


                const enemigoY =
                    parseFloat(
                        enemigo.style.top
                    );


                if (

                    bala.x + 9 >
                    enemigoX &&

                    bala.x <
                    enemigoX + 45 &&

                    bala.y + 25 >
                    enemigoY &&

                    bala.y <
                    enemigoY + 45

                ) {

                    puntos++;


                    puntosTexto.textContent =
                        "🏆 Puntos: " +
                        puntos;


                    sonidoImpacto();

                    mostrarImpacto();


                    bala.elemento.remove();


                    balas.splice(i, 1);


                    crearEnemigo();

                }

            }

        }

    }


    requestAnimationFrame(
        actualizar
    );

}


/* ==============================
   CAMBIAR TAMAÑO
============================== */

window.addEventListener(
    "resize",
    function() {

        if (!jugando) return;

        x = Math.min(
            x,
            window.innerWidth - 44
        );

        y = Math.min(
            y,
            window.innerHeight - 44
        );

    }
);


/* ==============================
   INICIAR
============================== */

jugador.style.left =
    "50%";

jugador.style.top =
    "80%";

jugador.style.display =
    "none";


actualizar();

</script>

</body>
</html>
