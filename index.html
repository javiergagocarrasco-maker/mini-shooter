<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>
Disparos Antiestrés Online
</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #08080d;

    font-family: Arial, sans-serif;
}

canvas {

    display: block;

    width: 100vw;
    height: 100vh;

    cursor: crosshair;
}

.pantalla {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #292933,
            #07070b
        );

    z-index: 20;
}

.caja {

    width: min(92%, 500px);

    padding: 35px;

    text-align: center;

    background: #19191f;

    border: 2px solid #444;

    border-radius: 25px;

    box-shadow: 0 0 60px #000;
}

.logo {

    font-size: 70px;
}

h1 {

    color: white;

    font-size: 36px;
}

h2 {

    color: white;
}

p {

    color: #aaa;
}

button {

    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border: 0;

    border-radius: 12px;

    background: #35353e;

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    background: #555562;
}

.rojo {

    background: #e63946;
}

input {

    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border: 2px solid #444;

    border-radius: 12px;

    background: #0e0e13;

    color: white;

    text-align: center;

    font-size: 26px;

    letter-spacing: 5px;

    outline: none;
}

.codigo {

    color: #ffd83d;

    font-size: 45px;

    font-weight: bold;

    letter-spacing: 8px;

    margin: 20px;
}

.oculto {

    display: none !important;
}

#info {

    position: fixed;

    top: 15px;
    left: 20px;

    z-index: 5;

    color: white;

    font-size: 22px;

    font-weight: bold;

    line-height: 1.5;
}

#jugadores {

    position: fixed;

    top: 15px;
    right: 20px;

    z-index: 5;

    color: white;

    background: rgba(20,20,25,.9);

    padding: 12px 18px;

    border-radius: 12px;
}

#partida {

    position: fixed;

    top: 70px;
    right: 20px;

    z-index: 5;

    color: #ffd83d;

    background: rgba(20,20,25,.9);

    padding: 10px 15px;

    border-radius: 12px;

    font-weight: bold;
}

#ayuda {

    position: fixed;

    bottom: 15px;

    left: 50%;

    transform:
        translateX(-50%);

    color: #aaa;

    z-index: 5;

    font-size: 14px;
}

#flash {

    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 4;
}

</style>

</head>

<body>

<canvas id="juego"></canvas>


<!-- ========================= -->
<!-- MENÚ -->
<!-- ========================= -->

<div
    id="menu"
    class="pantalla"
>

<div class="caja">

<div class="logo">
🔫
</div>

<h1>
DISPAROS ANTIESTRÉS
</h1>

<h2>
🌐 MULTIJUGADOR
</h2>

<p id="conexion">
🔴 Conectando...
</p>

<button
    id="crear"
    class="rojo"
>

🎮 CREAR PARTIDA

</button>

<button id="mostrarUnirse">

👥 UNIRSE A PARTIDA

</button>

<button id="pantallaMenu">

🖥️ PANTALLA COMPLETA

</button>

<button id="sonido">

🔊 SONIDO ACTIVADO

</button>

</div>

</div>


<!-- ========================= -->
<!-- PARTIDA CREADA -->
<!-- ========================= -->

<div
    id="creada"
    class="pantalla oculto"
>

<div class="caja">

<div class="logo">
🎮
</div>

<h2>
PARTIDA CREADA
</h2>

<p>
Dale este código a Igor:
</p>

<div
    id="codigo"
    class="codigo"
>
------
</div>

<button id="copiar">

📋 COPIAR CÓDIGO

</button>

<button
    id="jugarCreador"
    class="rojo"
>

▶ ENTRAR

</button>

<button id="volver1">

← VOLVER

</button>

</div>

</div>


<!-- ========================= -->
<!-- UNIRSE -->
<!-- ========================= -->

<div
    id="unirse"
    class="pantalla oculto"
>

<div class="caja">

<div class="logo">
👥
</div>

<h2>
UNIRSE A PARTIDA
</h2>

<p>
Introduce el código de Igor
</p>

<input
    id="entrada"
    maxlength="6"
    inputmode="numeric"
    placeholder="123456"
>

<button
    id="unir"
    class="rojo"
>

🎮 UNIRSE

</button>

<button id="volver2">

← VOLVER

</button>

</div>

</div>


<!-- ========================= -->
<!-- PAUSA -->
<!-- ========================= -->

<div
    id="pausa"
    class="pantalla oculto"
>

<div class="caja">

<div class="logo">
⏸️
</div>

<h1>
PAUSA
</h1>

<button id="continuar">

▶ CONTINUAR

</button>

<button id="reiniciar">

🔄 REINICIAR

</button>

<button id="pantallaPausa">

🖥️ PANTALLA COMPLETA

</button>

<button id="menuBoton">

🏠 MENÚ

</button>

</div>

</div>


<!-- ========================= -->
<!-- INFORMACIÓN -->
<!-- ========================= -->

<div id="info">

🎯 Puntos:
<span id="puntos">
0
</span>

</div>

<div id="jugadores">

👥 Jugadores:
<span id="numero">
0
</span>

</div>

<div id="partida">

🎮 Partida:
<span id="codigoActual">
------
</span>

</div>

<div id="ayuda">

🖱️ DISPARAR
&nbsp; | &nbsp;
ESC PAUSA
&nbsp; | &nbsp;
R REINICIAR

</div>

<div id="flash"></div>


<script>

// ========================================
// ELEMENTOS
// ========================================

const canvas =
    document.getElementById(
        "juego"
    );

const ctx =
    canvas.getContext("2d");

const menu =
    document.getElementById(
        "menu"
    );

const creada =
    document.getElementById(
        "creada"
    );

const unirse =
    document.getElementById(
        "unirse"
    );

const pausa =
    document.getElementById(
        "pausa"
    );

const conexionTexto =
    document.getElementById(
        "conexion"
    );

const codigoTexto =
    document.getElementById(
        "codigo"
    );

const entrada =
    document.getElementById(
        "entrada"
    );

const codigoActual =
    document.getElementById(
        "codigoActual"
    );

const puntosTexto =
    document.getElementById(
        "puntos"
    );

const numero =
    document.getElementById(
        "numero"
    );

const flash =
    document.getElementById(
        "flash"
    );


// ========================================
// VARIABLES
// ========================================

let ancho =
    window.innerWidth;

let alto =
    window.innerHeight;

let socket = null;

let miId = null;

let miPartida = null;

let jugadores = {};

let objetivos = [];

let puntos = 0;

let jugando = false;

let enPausa = false;

let sonidoActivado = true;

let ratonX = 0;

let ratonY = 0;

let ultimaBala = 0;

let particulas = [];

let audio = null;


// ========================================
// CANVAS
// ========================================

function tamano(){

    ancho =
        canvas.width =
        window.innerWidth;

    alto =
        canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    tamano
);

tamano();


// ========================================
// SONIDO
// ========================================

function iniciarAudio(){

    if (!audio) {

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audio.state ===
        "suspended"
    ) {

        audio.resume();
    }
}

function sonidoDisparo(){

    if (!sonidoActivado)
        return;

    iniciarAudio();

    const o =
        audio.createOscillator();

    const g =
        audio.createGain();

    o.type =
        "square";

    o.frequency.setValueAtTime(
        150,
        audio.currentTime
    );

    o.frequency.exponentialRampToValueAtTime(
        50,
        audio.currentTime + .08
    );

    g.gain.setValueAtTime(
        .18,
        audio.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + .08
    );

    o.connect(g);

    g.connect(
        audio.destination
    );

    o.start();

    o.stop(
        audio.currentTime + .08
    );
}

function sonidoAcierto(){

    if (!sonidoActivado)
        return;

    iniciarAudio();

    const o =
        audio.createOscillator();

    const g =
        audio.createGain();

    o.type =
        "sine";

    o.frequency.setValueAtTime(
        500,
        audio.currentTime
    );

    o.frequency.exponentialRampToValueAtTime(
        900,
        audio.currentTime + .12
    );

    g.gain.setValueAtTime(
        .15,
        audio.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + .12
    );

    o.connect(g);

    g.connect(
        audio.destination
    );

    o.start();

    o.stop(
        audio.currentTime + .12
    );
}


// ========================================
// CONECTAR
// ========================================

function conectar(){

    const protocolo =
        location.protocol ===
        "https:"
        ? "wss:"
        : "ws:";

    socket =
        new WebSocket(
            protocolo +
            "//" +
            location.host
        );

    socket.onopen =
        function(){

        conexionTexto.textContent =
            "🟢 Servidor conectado";
    };

    socket.onmessage =
        function(evento){

        const datos =
            JSON.parse(
                evento.data
            );

        if (
            datos.tipo ===
            "conexion"
        ) {

            miId =
                datos.id;
        }

        if (
            datos.tipo ===
            "partida_creada"
        ) {

            miPartida =
                datos.codigo;

            codigoTexto.textContent =
                datos.codigo;

            codigoActual.textContent =
                datos.codigo;

            menu.classList.add(
                "oculto"
            );

            creada.classList.remove(
                "oculto"
            );
        }

        if (
            datos.tipo ===
            "unido"
        ) {

            miPartida =
                datos.codigo;

            codigoActual.textContent =
                datos.codigo;

            unirse.classList.add(
                "oculto"
            );

            empezar();
        }

        if (
            datos.tipo ===
            "estado"
        ) {

            jugadores =
                datos.jugadores;

            objetivos =
                datos.objetivos;

            miPartida =
                datos.partida;

            codigoActual.textContent =
                miPartida;

            numero.textContent =
                Object.keys(
                    jugadores
                ).length;

            if (
                miId &&
                jugadores[miId]
            ) {

                puntos =
                    jugadores[miId]
                        .puntos;

                puntosTexto.textContent =
                    puntos;
            }
        }

        if (
            datos.tipo ===
            "disparo"
        ) {

            crearParticulas(
                datos.x,
                datos.y
            );

            if (
                datos.jugador !==
                miId
            ) {

                sonidoDisparo();
            }

            if (
                datos.acertado
            ) {

                sonidoAcierto();
            }
        }

        if (
            datos.tipo ===
            "error"
        ) {

            alert(
                datos.mensaje
            );
        }
    };

    socket.onclose =
        function(){

        conexionTexto.textContent =
            "🔴 Servidor desconectado";
    };
}

conectar();


// ========================================
// CREAR PARTIDA
// ========================================

document.getElementById(
    "crear"
).onclick =
function(){

    iniciarAudio();

    if (
        socket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "El servidor todavía no está conectado."
        );

        return;
    }

    socket.send(
        JSON.stringify({

            tipo:
                "crear_partida"
        })
    );
};


// ========================================
// ENTRAR
// ========================================

document.getElementById(
    "jugarCreador"
).onclick =
function(){

    empezar();
};

function empezar(){

    jugando =
        true;

    enPausa =
        false;

    creada.classList.add(
        "oculto"
    );

    menu.classList.add(
        "oculto"
    );

    unirse.classList.add(
        "oculto"
    );

    iniciarAudio();
}


// ========================================
// MOSTRAR UNIRSE
// ========================================

document.getElementById(
    "mostrarUnirse"
).onclick =
function(){

    menu.classList.add(
        "oculto"
    );

    unirse.classList.remove(
        "oculto"
    );
};


// ========================================
// UNIRSE
// ========================================

document.getElementById(
    "unir"
).onclick =
function(){

    const codigo =
        entrada.value.trim();

    if (
        codigo.length !== 6
    ) {

        alert(
            "Escribe un código de 6 números."
        );

        return;
    }

    if (
        socket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "El servidor no está conectado."
        );

        return;
    }

    socket.send(
        JSON.stringify({

            tipo:
                "unirse_partida",

            codigo:
                codigo
        })
    );
};


// ========================================
// COPIAR
// ========================================

document.getElementById(
    "copiar"
).onclick =
async function(){

    const codigo =
        codigoTexto.textContent;

    try {

        await navigator.clipboard
            .writeText(codigo);

        this.textContent =
            "✅ COPIADO";

        setTimeout(
            () => {

                this.textContent =
                    "📋 COPIAR CÓDIGO";

            },
            1500
        );

    } catch {

        alert(
            "Código: " + codigo
        );
    }
};


// ========================================
// VOLVER
// ========================================

document.getElementById(
    "volver1"
).onclick =
function(){

    creada.classList.add(
        "oculto"
    );

    menu.classList.remove(
        "oculto"
    );
};

document.getElementById(
    "volver2"
).onclick =
function(){

    unirse.classList.add(
        "oculto"
    );

    menu.classList.remove(
        "oculto"
    );
};


// ========================================
// DISPARAR
// ========================================

function disparar(x,y){

    if (!jugando)
        return;

    if (enPausa)
        return;

    const ahora =
        Date.now();

    if (
        ahora -
        ultimaBala <
        70
    ) {

        return;
    }

    ultimaBala =
        ahora;

    sonidoDisparo();

    flash.style.opacity =
        ".15";

    setTimeout(
        () => {

            flash.style.opacity =
                "0";

        },
        40
    );

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({

                tipo:
                    "disparo",

                x:
                    x,

                y:
                    y
            })
        );
    }
}

canvas.addEventListener(
    "mousedown",
    function(e){

        if (
            e.button === 0
        ) {

            disparar(
                e.clientX,
                e.clientY
            );
        }
    }
);

document.addEventListener(
    "mousemove",
    function(e){

        ratonX =
            e.clientX;

        ratonY =
            e.clientY;
    }
);


// ========================================
// PARTÍCULAS
// ========================================

function crearParticulas(x,y){

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const angulo =
            Math.random() *
            Math.PI *
            2;

        const velocidad =
            Math.random() * 6 + 2;

        particulas.push({

            x: x,

            y: y,

            vx:
                Math.cos(angulo) *
                velocidad,

            vy:
                Math.sin(angulo) *
                velocidad,

            vida: 30
        });
    }
}

function actualizarParticulas(){

    for (
        let i =
            particulas.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particulas[i];

        p.x += p.vx;

        p.y += p.vy;

        p.vy += .12;

        p.vida--;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffd83d";

        ctx.fill();

        if (
            p.vida <= 0
        ) {

            particulas.splice(
                i,
                1
            );
        }
    }
}


// ========================================
// OBJETIVOS
// ========================================

function dibujarObjetivos(){

    objetivos.forEach(
        function(o){

        ctx.beginPath();

        ctx.arc(
            o.x,
            o.y,
            o.radio,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ff3030";

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            o.x,
            o.y,
            o.radio * .55,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffd83d";

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            o.x,
            o.y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "white";

        ctx.fill();
    });
}


// ========================================
// MIRA
// ========================================

function dibujarMira(){

    ctx.beginPath();

    ctx.arc(
        ratonX,
        ratonY,
        14,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        2;

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        ratonX - 22,
        ratonY
    );

    ctx.lineTo(
        ratonX + 22,
        ratonY
    );

    ctx.moveTo(
        ratonX,
        ratonY - 22
    );

    ctx.lineTo(
        ratonX,
        ratonY + 22
    );

    ctx.stroke();
}


// ========================================
// PAUSA
// ========================================

function cambiarPausa(){

    if (!jugando)
        return;

    enPausa =
        !enPausa;

    pausa.classList.toggle(
        "oculto",
        !enPausa
    );
}

document.addEventListener(
    "keydown",
    function(e){

        if (
            e.key ===
            "Escape"
        ) {

            cambiarPausa();
        }

        if (
            e.key.toLowerCase() ===
            "r"
        ) {

            reiniciar();
        }

        if (
            e.key.toLowerCase() ===
            "f"
        ) {

            pantallaCompleta();
        }
    }
);


// ========================================
// CONTINUAR
// ========================================

document.getElementById(
    "continuar"
).onclick =
function(){

    enPausa =
        false;

    pausa.classList.add(
        "oculto"
    );
};


// ========================================
// REINICIAR
// ========================================

function reiniciar(){

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({

                tipo:
                    "reiniciar"
            })
        );
    }
}

document.getElementById(
    "reiniciar"
).onclick =
function(){

    reiniciar();

    enPausa =
        false;

    pausa.classList.add(
        "oculto"
    );
};


// ========================================
// MENÚ
// ========================================

document.getElementById(
    "menuBoton"
).onclick =
function(){

    jugando =
        false;

    enPausa =
        false;

    pausa.classList.add(
        "oculto"
    );

    menu.classList.remove(
        "oculto"
    );
};


// ========================================
// SONIDO
// ========================================

document.getElementById(
    "sonido"
).onclick =
function(){

    sonidoActivado =
        !sonidoActivado;

    this.textContent =
        sonidoActivado
        ? "🔊 SONIDO ACTIVADO"
        : "🔇 SONIDO DESACTIVADO";
};


// ========================================
// PANTALLA COMPLETA
// ========================================

function pantallaCompleta(){

    if (
        !document.fullscreenElement
    ) {

        document.documentElement
            .requestFullscreen();

    } else {

        document.exitFullscreen();
    }
}

document.getElementById(
    "pantallaMenu"
).onclick =
pantallaCompleta;

document.getElementById(
    "pantallaPausa"
).onclick =
pantallaCompleta;


// ========================================
// BUCLE
// ========================================

function bucle(){

    ctx.fillStyle =
        "#0d0d12";

    ctx.fillRect(
        0,
        0,
        ancho,
        alto
    );

    if (
        jugando &&
        !enPausa
    ) {

        dibujarObjetivos();

        actualizarParticulas();

        dibujarMira();
    }

    requestAnimationFrame(
        bucle
    );
}

bucle();

</script>

</body>
</html>
