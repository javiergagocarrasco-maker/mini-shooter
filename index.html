<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Disparos Antiestrés</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #08080c;
    font-family: Arial, sans-serif;
    cursor: crosshair;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #0d0d12;
}

/* =========================
   MENÚ DE INICIO
========================= */

#menuInicio {
    position: fixed;
    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #252530 0%,
            #0b0b10 70%
        );

    z-index: 20;
}

#cajaInicio {
    width: min(90%, 500px);

    padding: 45px;

    text-align: center;

    background: rgba(20,20,27,0.95);

    border: 2px solid #444;

    border-radius: 25px;

    box-shadow:
        0 0 50px rgba(0,0,0,0.8);
}

.logo {
    font-size: 75px;
    margin-bottom: 5px;
}

#cajaInicio h1 {
    margin: 0;

    color: white;

    font-size: 48px;

    letter-spacing: 2px;
}

.subtitulo {
    color: #999;

    font-size: 18px;

    margin-bottom: 30px;
}

button {
    width: 100%;

    padding: 17px;

    margin-top: 12px;

    border: 0;

    border-radius: 12px;

    background: #33333d;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #50505d;

    transform: scale(1.02);
}

.botonJugar {
    background: #e63946;
}

.botonJugar:hover {
    background: #ff4d5a;
}

/* =========================
   INFORMACIÓN
========================= */

#info {
    position: fixed;

    top: 15px;
    left: 20px;

    z-index: 5;

    color: white;

    font-size: 24px;

    font-weight: bold;

    pointer-events: none;
}

#ayuda {
    position: fixed;

    bottom: 15px;

    left: 50%;

    transform: translateX(-50%);

    color: #aaa;

    font-size: 15px;

    z-index: 5;

    pointer-events: none;
}

/* =========================
   FLASH
========================= */

#flash {
    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 4;
}

/* =========================
   PAUSA
========================= */

#menuPausa {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    background: rgba(0,0,0,0.78);

    z-index: 10;
}

#cajaPausa {
    width: min(90%,420px);

    padding: 35px;

    text-align: center;

    background: #18181f;

    border: 2px solid #444;

    border-radius: 20px;
}

#cajaPausa h1 {
    margin-top: 0;

    color: white;

    font-size: 48px;
}

</style>
</head>

<body>

<!-- =========================
     CANVAS
========================= -->

<canvas id="juego"></canvas>

<!-- =========================
     MENÚ DE INICIO
========================= -->

<div id="menuInicio">

    <div id="cajaInicio">

        <div class="logo">
            🔫
        </div>

        <h1>
            DISPAROS ANTIESTRÉS
        </h1>

        <div class="subtitulo">
            Apunta · Dispara · Relájate
        </div>

        <button
            class="botonJugar"
            id="jugar">
            ▶ JUGAR
        </button>

        <button id="pantallaInicio">
            🖥️ PANTALLA COMPLETA
        </button>

        <button id="sonido">
            🔊 SONIDO ACTIVADO
        </button>

    </div>

</div>

<!-- =========================
     INFORMACIÓN
========================= -->

<div id="info">
    Puntos: <span id="puntos">0</span>
</div>

<div id="ayuda">
    🖱️ CLIC = DISPARAR |
    ESC = PAUSA |
    R = REINICIAR |
    F = PANTALLA COMPLETA
</div>

<div id="flash"></div>

<!-- =========================
     MENÚ DE PAUSA
========================= -->

<div id="menuPausa">

    <div id="cajaPausa">

        <h1>
            PAUSA
        </h1>

        <button id="continuar">
            ▶ CONTINUAR
        </button>

        <button id="reiniciar">
            🔄 REINICIAR
        </button>

        <button id="pantallaCompleta">
            🖥️ PANTALLA COMPLETA
        </button>

        <button id="salir">
            🏠 MENÚ PRINCIPAL
        </button>

    </div>

</div>

<script>

// ==========================================
// CANVAS
// ==========================================

const canvas =
    document.getElementById("juego");

const ctx =
    canvas.getContext("2d");

const puntosTexto =
    document.getElementById("puntos");

const menuInicio =
    document.getElementById("menuInicio");

const menuPausa =
    document.getElementById("menuPausa");

const flash =
    document.getElementById("flash");

let ancho;
let alto;

let puntos = 0;

let pausado = false;

let jugando = false;

let sonidoActivado = true;

let objetivos = [];

let particulas = [];

let ratonX = 0;
let ratonY = 0;

let ultimoDisparo = 0;

// ==========================================
// TAMAÑO
// ==========================================

function cambiarTamaño() {

    ancho =
        canvas.width =
        window.innerWidth;

    alto =
        canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    cambiarTamaño
);

cambiarTamaño();

// ==========================================
// AUDIO
// ==========================================

let audioContext = null;

function iniciarAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}

function sonidoDisparo() {

    if (!sonidoActivado) return;

    iniciarAudio();

    const oscilador =
        audioContext.createOscillator();

    const ganancia =
        audioContext.createGain();

    oscilador.type =
        "sawtooth";

    oscilador.frequency.setValueAtTime(
        180,
        audioContext.currentTime
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        60,
        audioContext.currentTime + 0.08
    );

    ganancia.gain.setValueAtTime(
        0.25,
        audioContext.currentTime
    );

    ganancia.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.08
    );

    oscilador.connect(ganancia);

    ganancia.connect(
        audioContext.destination
    );

    oscilador.start();

    oscilador.stop(
        audioContext.currentTime + 0.08
    );
}

function sonidoAcierto() {

    if (!sonidoActivado) return;

    iniciarAudio();

    const oscilador =
        audioContext.createOscillator();

    const ganancia =
        audioContext.createGain();

    oscilador.type =
        "square";

    oscilador.frequency.setValueAtTime(
        450,
        audioContext.currentTime
    );

    oscilador.frequency.exponentialRampToValueAtTime(
        900,
        audioContext.currentTime + 0.12
    );

    ganancia.gain.setValueAtTime(
        0.18,
        audioContext.currentTime
    );

    ganancia.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.12
    );

    oscilador.connect(ganancia);

    ganancia.connect(
        audioContext.destination
    );

    oscilador.start();

    oscilador.stop(
        audioContext.currentTime + 0.12
    );
}

// ==========================================
// OBJETIVOS
// ==========================================

function crearObjetivo() {

    const radio =
        Math.floor(
            Math.random() * 25
        ) + 30;

    objetivos.push({

        x:
            Math.random() *
            (ancho - radio * 2) +
            radio,

        y:
            Math.random() *
            (alto - 170 - radio) +
            100,

        radio:
            radio
    });
}

function crearTodosLosObjetivos() {

    objetivos = [];

    for (
        let i = 0;
        i < 9;
        i++
    ) {

        crearObjetivo();
    }
}

// ==========================================
// PARTÍCULAS
// ==========================================

function crearParticulas(x,y) {

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const angulo =
            Math.random() *
            Math.PI *
            2;

        const velocidad =
            Math.random() * 7 + 2;

        particulas.push({

            x:x,

            y:y,

            vx:
                Math.cos(angulo) *
                velocidad,

            vy:
                Math.sin(angulo) *
                velocidad,

            vida:35
        });
    }
}

// ==========================================
// DISPARAR
// ==========================================

function disparar(x,y) {

    if (!jugando) return;

    if (pausado) return;

    const ahora =
        Date.now();

    if (
        ahora -
        ultimoDisparo <
        70
    ) {

        return;
    }

    ultimoDisparo =
        ahora;

    sonidoDisparo();

    flash.style.opacity =
        "0.18";

    setTimeout(
        () => {

            flash.style.opacity =
                "0";

        },
        40
    );

    for (
        let i =
            objetivos.length - 1;

        i >= 0;

        i--
    ) {

        const objetivo =
            objetivos[i];

        const distancia =
            Math.sqrt(

                (x - objetivo.x) *
                (x - objetivo.x)

                +

                (y - objetivo.y) *
                (y - objetivo.y)
            );

        if (
            distancia <
            objetivo.radio
        ) {

            puntos++;

            puntosTexto.textContent =
                puntos;

            sonidoAcierto();

            crearParticulas(
                objetivo.x,
                objetivo.y
            );

            objetivos.splice(
                i,
                1
            );

            crearObjetivo();

            break;
        }
    }
}

// ==========================================
// RATÓN
// ==========================================

canvas.addEventListener(
    "mousedown",
    function(evento) {

        if (
            evento.button === 0
        ) {

            disparar(
                evento.clientX,
                evento.clientY
            );
        }
    }
);

document.addEventListener(
    "mousemove",
    function(evento) {

        ratonX =
            evento.clientX;

        ratonY =
            evento.clientY;
    }
);

// ==========================================
// PANTALLA COMPLETA
// ==========================================

function pantallaCompleta() {

    if (
        !document.fullscreenElement
    ) {

        document.documentElement
            .requestFullscreen();

    } else {

        document.exitFullscreen();
    }
}

// ==========================================
// EMPEZAR JUEGO
// ==========================================

function empezarJuego() {

    iniciarAudio();

    jugando = true;

    pausado = false;

    puntos = 0;

    puntosTexto.textContent =
        "0";

    particulas = [];

    crearTodosLosObjetivos();

    menuInicio.style.display =
        "none";
}

// ==========================================
// BOTÓN JUGAR
// ==========================================

document.getElementById(
    "jugar"
).addEventListener(
    "click",
    empezarJuego
);

// ==========================================
// SONIDO
// ==========================================

document.getElementById(
    "sonido"
).addEventListener(
    "click",
    function() {

        sonidoActivado =
            !sonidoActivado;

        this.textContent =
            sonidoActivado
            ? "🔊 SONIDO ACTIVADO"
            : "🔇 SONIDO DESACTIVADO";
    }
);

// ==========================================
// PANTALLA COMPLETA INICIO
// ==========================================

document.getElementById(
    "pantallaInicio"
).addEventListener(
    "click",
    pantallaCompleta
);

// ==========================================
// PAUSA
// ==========================================

function cambiarPausa() {

    if (!jugando) return;

    pausado =
        !pausado;

    menuPausa.style.display =
        pausado
        ? "flex"
        : "none";
}

document.addEventListener(
    "keydown",
    function(evento) {

        if (
            evento.key ===
            "Escape"
        ) {

            cambiarPausa();
        }

        if (
            evento.key.toLowerCase()
            === "r"
        ) {

            reiniciarJuego();
        }

        if (
            evento.key.toLowerCase()
            === "f"
        ) {

            pantallaCompleta();
        }
    }
);

// ==========================================
// REINICIAR
// ==========================================

function reiniciarJuego() {

    if (!jugando) return;

    puntos = 0;

    puntosTexto.textContent =
        "0";

    particulas = [];

    crearTodosLosObjetivos();
}

document.getElementById(
    "reiniciar"
).addEventListener(
    "click",
    function() {

        reiniciarJuego();

        pausado = false;

        menuPausa.style.display =
            "none";
    }
);

// ==========================================
// CONTINUAR
// ==========================================

document.getElementById(
    "continuar"
).addEventListener(
    "click",
    function() {

        pausado = false;

        menuPausa.style.display =
            "none";
    }
);

// ==========================================
// PANTALLA COMPLETA PAUSA
// ==========================================

document.getElementById(
    "pantallaCompleta"
).addEventListener(
    "click",
    pantallaCompleta
);

// ==========================================
// MENÚ PRINCIPAL
// ==========================================

document.getElementById(
    "salir"
).addEventListener(
    "click",
    function() {

        jugando = false;

        pausado = false;

        menuPausa.style.display =
            "none";

        menuInicio.style.display =
            "flex";
    }
);

// ==========================================
// DIBUJAR OBJETIVOS
// ==========================================

function dibujarObjetivos() {

    for (
        const objetivo of objetivos
    ) {

        ctx.beginPath();

        ctx.arc(
            objetivo.x,
            objetivo.y,
            objetivo.radio,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ff3030";

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            objetivo.x,
            objetivo.y,
            objetivo.radio * 0.55,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffd83d";

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            objetivo.x,
            objetivo.y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "white";

        ctx.fill();
    }
}

// ==========================================
// PARTÍCULAS
// ==========================================

function actualizarParticulas() {

    for (
        let i =
            particulas.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particulas[i];

        p.x += p.vx;

        p.y += p.vy;

        p.vy += 0.12;

        p.vida--;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffd83d";

        ctx.fill();

        if (
            p.vida <= 0
        ) {

            particulas.splice(
                i,
                1
            );
        }
    }
}

// ==========================================
// MIRA
// ==========================================

function dibujarMira() {

    ctx.beginPath();

    ctx.arc(
        ratonX,
        ratonY,
        14,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(255,255,255,0.7)";

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        ratonX - 22,
        ratonY
    );

    ctx.lineTo(
        ratonX + 22,
        ratonY
    );

    ctx.moveTo(
        ratonX,
        ratonY - 22
    );

    ctx.lineTo(
        ratonX,
        ratonY + 22
    );

    ctx.stroke();
}

// ==========================================
// BUCLE
// ==========================================

function juego() {

    ctx.fillStyle =
        "#0d0d12";

    ctx.fillRect(
        0,
        0,
        ancho,
        alto
    );

    if (
        jugando &&
        !pausado
    ) {

        dibujarObjetivos();

        actualizarParticulas();

        dibujarMira();
    }

    requestAnimationFrame(
        juego
    );
}

juego();

</script>

</body>
</html>
